name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Optional notes for the GitHub release
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.129.0"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="release-${{ github.run_number }}"
          body="Deployed ${{ github.sha }} to https://dmdfurniture.uk"
          if [ -n "$NOTES" ]; then
            body="$(printf '%s\n\n%s' "$body" "$NOTES")"
          fi
          gh release create "$tag" \
            --title "Release ${{ github.run_number }}" \
            --notes "$body" \
            --target "${{ github.sha }}"
