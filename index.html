<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <title>DMD — Kitchen and furniture projects</title>
    <link rel="canonical" href="https://dmdfurniture.uk/" />
    <meta
      name="description"
      content="Send a kitchen or furniture project. Get a materials plan and a next step — DIY, another tradesperson, or a build."
    />
    <script id="geo-boot">window.__COUNTRY__="";</script>
    <script>
      (() => {
        const stored = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark =
          stored === 'dark' || ((stored === 'system' || !stored) && prefersDark)
        document.documentElement.classList.toggle('dark', isDark)

        const query = new URLSearchParams(location.search).get('lang')
        const saved = localStorage.getItem('locale')
        const cookie = (document.cookie.match(/(?:^|; )dmd-country=([^;]*)/) || [])[1]
        const country = window.__COUNTRY__ || (cookie ? decodeURIComponent(cookie) : '')
        const inBulgaria =
          country === 'BG' ||
          (!country &&
            (() => {
              try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Sofia'
              } catch {
                return false
              }
            })())
        const locale =
          query === 'bg' || query === 'en'
            ? query
            : saved === 'bg' || saved === 'en'
              ? saved
              : inBulgaria
                ? 'bg'
                : 'en'
        document.documentElement.lang = locale
        if (locale === 'bg') {
          document.title = 'DMD — Кухненски и мебелни проекти'
          const description = document.querySelector('meta[name="description"]')
          if (description) {
            description.setAttribute(
              'content',
              'Пратете кухненски или мебелен проект. Получавате план за материали и следваща стъпка — сами, друг майстор, или изработка.',
            )
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
